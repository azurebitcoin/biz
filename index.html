<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2usa.biz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1b3e 0%, #1a3a7a 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 560px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px 32px;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    h1 span { color: #ff4d4d; }
    p { font-size: 1.1rem; line-height: 1.6; color: #cfd8ea; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 18px;
      background: #ff4d4d;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>2</span>usa.biz</h1>
    <p>Сайт работает и опубликован через GitHub Pages.<br>Замените этот текст на свой контент в файле <code>index.html</code>.</p>
    <a class="badge" href="https://github.com/azurebitcoin/biz">Источник на GitHub</a>
  </div>
</body>
</html>
